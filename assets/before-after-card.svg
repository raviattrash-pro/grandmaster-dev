<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="comp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0D1322"/>
    </linearGradient>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1100" height="480" rx="18" fill="url(#comp-bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#F8FAFC">
    CODE QUALITY BENCHMARK: FINANCIAL TRANSFER
  </text>
  <text x="40" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8">
    Direct comparison between default AI output and Grandmaster Dev Kernel output.
  </text>

  <!-- Left: Junior AI Code -->
  <g transform="translate(40, 100)" filter="url(#box-shadow)">
    <rect width="490" height="340" rx="12" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
    <!-- Tag -->
    <rect x="20" y="16" width="200" height="26" rx="6" fill="#7F1D1D" fill-opacity="0.4"/>
    <text x="28" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#F87171">✕ DEFAULT AI (JUNIOR)</text>

    <!-- Code Block -->
    <g transform="translate(20, 56)">
      <rect width="450" height="200" rx="8" fill="#030712"/>
      <text x="16" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6B7280">// Mixed layers, no validation, race bug</text>
      <text x="16" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#F43F5E">app.post('/api/transfer', async (req, res) =&gt; {</text>
      <text x="16" y="68" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">  const { fromId, toId, amt } = req.body;</text>
      <text x="16" y="88" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6B7280">  // Vulnerability: SQL Injection</text>
      <text x="16" y="108" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#F43F5E">  await db.query(`UPDATE users ... ${amt}`);</text>
      <text x="16" y="128" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6B7280">  // Race condition: No transaction lock!</text>
      <text x="16" y="148" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">  res.send('Success');</text>
      <text x="16" y="168" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#F43F5E">});</text>
    </g>

    <!-- Flaws List -->
    <text x="20" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#EF4444">✕ Missing input schema validation</text>
    <text x="20" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#EF4444">✕ Double-spend race condition (no locks)</text>
    <text x="20" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#EF4444">✕ Zero idempotency support</text>
  </g>

  <!-- Right: Grandmaster Staff Code -->
  <g transform="translate(570, 100)" filter="url(#box-shadow)">
    <rect width="490" height="340" rx="12" fill="#0B132B" stroke="#10B981" stroke-width="1.5"/>
    <!-- Tag -->
    <rect x="20" y="16" width="220" height="26" rx="6" fill="#064E3B" fill-opacity="0.5"/>
    <text x="28" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#34D399">✓ GRANDMASTER (STAFF)</text>

    <!-- Code Block -->
    <g transform="translate(20, 56)">
      <rect width="450" height="200" rx="8" fill="#030712"/>
      <text x="16" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#38BDF8">// Perimeter validation + Atomic transaction</text>
      <text x="16" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#A5B4FC">const input = TransferSchema.parse(body);</text>
      <text x="16" y="68" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">return await db.transaction(async (tx) =&gt; {</text>
      <text x="16" y="88" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#38BDF8">  // Prevents double-spend concurrency bug</text>
      <text x="16" y="108" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#34D399">  const sender = await tx.findForUpdate(id);</text>
      <text x="16" y="128" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#34D399">  await tx.idempotency.record(key, res);</text>
      <text x="16" y="148" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">  return { success: true, data: res };</text>
      <text x="16" y="168" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">});</text>
    </g>

    <!-- Merits List -->
    <text x="20" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34D399">✓ Zod runtime input schema verification</text>
    <text x="20" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34D399">✓ Row-level locks (SELECT FOR UPDATE) prevent double-spend</text>
    <text x="20" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34D399">✓ Strict idempotency key caching &amp; typed envelope</text>
  </g>
</svg>
