<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0D1322"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#glow-cyan)"/>
  <rect width="1280" height="440" fill="url(#glow-purple)"/>

  <!-- Outer Glass Frame -->
  <rect x="24" y="24" width="1232" height="392" rx="20" fill="#0F172A" fill-opacity="0.4" stroke="url(#card-border)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top Pill / Status Tag -->
  <g transform="translate(64, 58)">
    <rect width="320" height="34" rx="17" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="20" cy="17" r="5" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">STAFF ARCHITECT &amp; DEVSECOPS KERNEL</text>
  </g>

  <!-- Main Headline -->
  <text x="64" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="url(#title-grad)" letter-spacing="-1.5">
    GRANDMASTER DEV
  </text>

  <!-- Subtitle -->
  <text x="64" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    Drop-in 40-year veteran engineering seniority for <tspan fill="#38BDF8" font-weight="600">Cursor</tspan>, <tspan fill="#A78BFA" font-weight="600">Claude Code</tspan>, <tspan fill="#34D399" font-weight="600">Antigravity</tspan> &amp; <tspan fill="#F472B6" font-weight="600">Windsurf</tspan>.
  </text>

  <!-- Key Value Props Bar -->
  <g transform="translate(64, 230)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="url(#chip-grad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">⚡ 70% Token Savings</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(196, 0)">
      <rect width="180" height="42" rx="10" fill="url(#chip-grad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">🛡️ Zero-Trust Security</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(392, 0)">
      <rect width="190" height="42" rx="10" fill="url(#chip-grad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#A78BFA">🏛️ HLD &amp; Clean LLD</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(598, 0)">
      <rect width="190" height="42" rx="10" fill="url(#chip-grad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#34D399">🚩 Canary &amp; Circuit Brk</text>
    </g>
  </g>

  <!-- Bottom Terminal Snippet -->
  <g transform="translate(64, 304)">
    <rect width="700" height="58" rx="12" fill="#030712" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Terminal dots -->
    <circle cx="24" cy="29" r="5" fill="#EF4444"/>
    <circle cx="40" cy="29" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="29" r="5" fill="#10B981"/>
    <!-- Command -->
    <text x="80" y="35" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="16" fill="#64748B">$ </text>
    <text x="96" y="35" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#38BDF8">npx grandmaster-dev init</text>
    <text x="560" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#10B981">● 1-Sec Install</text>
  </g>

  <!-- Right Side Decorative Badge -->
  <g transform="translate(930, 90)">
    <rect width="250" height="270" rx="18" fill="#0B132B" fill-opacity="0.8" stroke="#1E293B" stroke-width="1.5"/>
    <text x="30" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="1">KERNEL MATRIX</text>
    
    <text x="30" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">✓ 13 Modular Skills</text>
    <text x="30" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">✓ Micro-Router (~150 tok)</text>
    <text x="30" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">✓ PWA &amp; Offline Sync</text>
    <text x="30" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">✓ REA Reverse Eng.</text>
    <text x="30" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">✓ Zero CLS (&lt; 0.05)</text>
    <text x="30" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">✓ MIT Licensed</text>
  </g>
</svg>
